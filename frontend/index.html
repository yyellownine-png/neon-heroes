<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05060c">
    <title>NEON HEROES</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="app">

    <header class="topbar">
        <div class="logo">
            <span>NEON</span>
            <strong>HEROES</strong>
        </div>

        <div class="resources">
            <div class="resource">
                <span class="gem-icon">◆</span>
                <b id="gems">100</b>
            </div>

            <div class="resource">
                <span class="coin-icon">●</span>
                <b id="coins">100</b>
            </div>
        </div>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav">

        <button class="nav-btn active" onclick="openScreen('home')">
            <span>⌂</span>
            <small>Главная</small>
        </button>

        <button class="nav-btn" onclick="openScreen('heroes')">
            <span>H</span>
            <small>Герои</small>
        </button>

        <button class="nav-center" onclick="openScreen('battle')">
            <span>⚔</span>
        </button>

        <button class="nav-btn" onclick="openScreen('chests')">
            <span>◆</span>
            <small>Сундуки</small>
        </button>

        <button class="nav-btn" onclick="openScreen('profile')">
            <span>◉</span>
            <small>Профиль</small>
        </button>

    </nav>
</div>

<div id="modal"></div>

<script src="app.js?v=14"></script>

</body>
</html>
